name: Set TCFLiCK OG image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  setup-og-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add OG image metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          image = 'https://tcflick.com/ChatGPT%20Image%202026%EB%85%84%209%EC%9B%94%2015%EC%9D%BC%20%EC%98%A4%EC%A0%84%2012_09_55.png'
          if 'property="og:image"' not in s:
              s = s.replace('<meta property="og:url" content="https://tcflick.com/"/>', '<meta property="og:url" content="https://tcflick.com/"/>\n<meta property="og:image" content="' + image + '"/>')
          if 'name="twitter:image"' not in s:
              s = s.replace('<meta name="twitter:card" content="summary"/>', '<meta name="twitter:card" content="summary_large_image"/>\n<meta name="twitter:image" content="' + image + '"/>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Set TCFLiCK social preview image' && git push)
