name: Refresh main page cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch index for cache refresh
        shell: bash
        run: |
          set -euo pipefail
          printf '\n<!-- TCFLiCK brand casing cache refresh -->\n' >> index.html
          rm -f .github/workflows/cache-refresh-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh main page cache'
          git push
