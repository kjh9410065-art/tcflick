name: Fix index brand casing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix index brand casing
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/TCFLICK/TCFLiCK/g' index.html
          rm -f .github/workflows/index-brand-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize TCFLiCK casing on main page'
          git push
