name: Normalize TCFLiCK brand casing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize brand casing
        shell: bash
        run: |
          set -euo pipefail
          OLD="TC""FLICK"
          NEW="TC""FLiCK"
          while IFS= read -r -d '' file; do
            sed -i "s/${OLD}/${NEW}/g" "$file"
          done < <(grep -RIlZ --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' --exclude='*.ico' --exclude='*.woff' --exclude='*.woff2' "$OLD" . || true)
          if grep -RIn --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' --exclude='*.ico' --exclude='*.woff' --exclude='*.woff2' "$OLD" .; then
            echo "Old brand casing remains."
            exit 1
          fi
          rm -f .github/workflows/branding-case-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: standardize TCFLiCK brand casing'
          git push
