<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>페이지를 찾을 수 없습니다 | TCFLiCK</title>
<style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}.wrap{width:min(680px,calc(100% - 32px));text-align:center}.logo{font-size:24px;font-weight:950;letter-spacing:-1px}.logo span{color:var(--blue)}.card{margin-top:28px;padding:54px 32px;background:var(--card);border:1px solid var(--line);border-radius:28px}.code{font-size:72px;line-height:1;font-weight:950;letter-spacing:-5px;color:var(--blue)}h1{margin:20px 0 10px;font-size:28px;letter-spacing:-1px}p{margin:0;color:var(--muted);line-height:1.7}.btn{display:inline-flex;margin-top:28px;padding:13px 20px;border-radius:13px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}
@media(prefers-color-scheme:dark){:root{--ink:#f1f5f9;--muted:#94a3b8;--line:#273449;--bg:#080d18;--card:#111827}}
</style>
</head>
<body><main class="wrap"><div class="logo">TC<span>FLiCK</span></div><div class="card"><div class="code">404</div><h1>페이지를 찾을 수 없습니다.</h1><p>주소가 변경되었거나 존재하지 않는 페이지입니다.<br>TCFLiCK 메인으로 돌아가 주세요.</p><a class="btn" href="/">메인으로 돌아가기</a></div></main></body>
</html>
